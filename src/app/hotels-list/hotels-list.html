<h1 class="available">{{ title() }}</h1>
<div class="hotel-wrapper">
    <!-- 
    
    Initializing wishlist with 0 items at first
    Conditionally checking if there are any wishlist items in the array. 
    -->
    @if(wishlist.length > 0){
        <div class="wishlist-banner">
            <span class="wishlist-heart">💓</span>
            <!-- 
            We loop through the wishlist to see of there are any hotel objects
            inside of our wishlist.. hotel could be x
            The child component uses the @Output decorator combined with an EventEmitter to send events, and the parent catches them using event binding.

            What is the purpose of @Input decorator in Angular?
            to mark a property in a child component as one that can receive data from its parent
            It allows data to be passed from a parent to a child component.
            Parent-child communication in Angular is the interaction between a parent component and a nested child component, where the parent passes data to the child and the child can communicate back to the parent.
            -->
            My Wishlist: 
            @for(hotel of wishlist; track hotel.title){
                <!-- Display each course title that has been added -->
                 <div class="wishlist-wrapper">
                    <span class="wishlist-item">{{hotel.title}}</span>
                 </div>
            }
        </div>
    }
